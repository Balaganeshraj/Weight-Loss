name: Backend validation
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-validation.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q -c backend/pytest.ini --junitxml=backend/test-results.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: VitalDay-backend-test-results
          path: backend/test-results.xml
          if-no-files-found: error
