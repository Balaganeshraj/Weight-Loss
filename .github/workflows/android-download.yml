name: Android download

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          # GitHub's Ubuntu runner already supplies Android command-line tools.
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          # yes exits with SIGPIPE once sdkmanager stops reading; only the
          # sdkmanager exit status should determine license acceptance success.
          (set +o pipefail; yes | "$sdkmanager_bin" --licenses > /dev/null)
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and validate
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew scripts/build-release.sh
          ./scripts/build-release.sh --no-daemon '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' --max-workers=2 --console=plain 2>&1 | tee build.log
      - name: Report build failure
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import os
          log = Path('build.log')
          if log.exists():
              text = log.read_text(errors='replace')
              excerpt = text[-2800:]
              escaped = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Build failure details::' + escaped)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Build failure details\n\n```text\n' + excerpt + '\n```\n')
      - name: Prepare downloads
        run: |
          mkdir downloads
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "${ANDROID_USER_HOME:-$HOME/.android}/debug.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --out downloads/VitalDay-installable-test.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify downloads/VitalDay-installable-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 downloads/VitalDay-installable-test.apk
          cp app/build/outputs/bundle/release/app-release.aab downloads/VitalDay-unsigned.aab
          cp PLAY_STORE_SUBMISSION.md release/SIGNING.md docs/vitalday/DELIVERY_STATUS.md downloads/
          git archive --format=zip --output=downloads/VitalDay-source.zip HEAD
          printf '%s\n' 'APK: optimized release build, development-signed for testing only. AAB: unsigned, requires owner signing before Play upload. Device testing remains required. The CI debug certificate may differ from other builds; an update may require uninstalling the older test app, which deletes its local data. Export your journal before uninstalling.' > downloads/READ-ME.txt
          cd downloads
          sha256sum *.apk *.aab *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: VitalDay-Android-download
          path: downloads/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: VitalDay-build-diagnostics
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
