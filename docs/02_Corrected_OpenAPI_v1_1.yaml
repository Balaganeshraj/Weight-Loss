openapi: 3.1.0
info:
  title: Wellbeing AI REST API - corrected implementation contract
  version: 1.1.0-draft
  description: IMPLEMENTATION CONTRACT (not deployed software). All non-public paths require authentication and resource-owner
    authorization, including files, jobs, export and deletion. The mobile app must not directly call the vision model.
    High-risk clinical features disabled server-side pending documented approvals. All timestamps RFC3339 UTC offsets;
    no silent user-data training. API review and integration testing still required.
servers:
- url: https://api.example.invalid/v1
  description: 'PLACEHOLDER ONLY: set production URL after security review'
security:
- bearerAuth: []
paths:
  /profile:
    get:
      summary: Get current user's profile
      responses:
        '200':
          description: Profile returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_profile
    put:
      summary: Update current user's profile/preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: put_profile
  /dashboard:
    get:
      summary: Current-day dashboard summary
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        required: false
      responses:
        '200':
          description: Dashboard totals and latest activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_dashboard
  /food/analyze-image:
    post:
      summary: Start asynchronous meal photo analysis
      description: Explicit purpose-specific consent required; only accept ready food_image uploaded by caller. Result
        contains editable candidates, never saves food log.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - image_upload_id
              - consent_version
              properties:
                image_upload_id:
                  type: string
                meal_context:
                  type:
                  - string
                  - 'null'
                  enum:
                  - breakfast
                  - lunch
                  - dinner
                  - snack
                  - null
                consent_version:
                  type: string
                locale:
                  type: string
                  enum:
                  - en
                  - si
                  - ta
                  default: en
              additionalProperties: false
      responses:
        '202':
          description: Analysis job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: File too large
        '429':
          description: Rate limit exceeded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: post_food_analyze_image
  /jobs/{job_id}:
    get:
      summary: Read the status of an asynchronous job owned by the caller
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          description: Not found or not owned by caller
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_jobs_job_id
  /food/logs:
    get:
      summary: List current user's food logs
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        schema:
          type: string
          format: date-time
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      responses:
        '200':
          description: Log page
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FoodLog'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_food_logs
    post:
      summary: Save a user-confirmed food log
      description: The client submits confirmed candidates and portion values; server recomputes totals.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodLogCreate'
      responses:
        '201':
          description: Saved log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: post_food_logs
  /activity/sessions:
    post:
      summary: Save completed workout/walking session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivitySessionCreate'
      responses:
        '201':
          description: Saved session
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      operationId: post_activity_sessions
    get:
      summary: List owned workout sessions
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivitySessionCreate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_activity_sessions
  /hydration/logs:
    post:
      summary: Add hydration log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HydrationLogCreate'
      responses:
        '201':
          description: Saved log
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      operationId: post_hydration_logs
    get:
      summary: List owned hydration logs
      responses:
        '200':
          description: Hydration entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HydrationLogCreate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_hydration_logs
  /products/barcode/{barcode}:
    get:
      summary: Find packaged product nutrition records by barcode
      parameters:
      - in: path
        name: barcode
        required: true
        schema:
          type: string
          minLength: 4
          maxLength: 32
      - in: query
        name: region
        schema:
          type: string
          default: LK
      responses:
        '200':
          description: Candidate list, possibly empty
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductNutrition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get_products_barcode_barcode
  /uploads/presign:
    post:
      summary: Create a short-lived upload URL for an approved file purpose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadPurposeRequest'
      responses:
        '201':
          description: Short-lived upload URL; do not log URL/token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      description: Purpose-dependent MIME and size validation; block lab_report when feature flag off; verify explicit
        owner consent, malware scan, checksum, and EXIF redaction policy.
      operationId: post_uploads_presign
  /reports:
    post:
      summary: Start a report OCR job; production endpoint disabled until clinical/legal sign-off
      description: Never return a diagnosis or treatment prescription. Require owner authorization and confirmed extraction.
        Disabled in all public releases unless written clinical, privacy and regulatory sign-offs; server-side default
        deny; no medical diagnosis.
      x-feature-flag: report_assistant_enabled__DEFAULT_FALSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - upload_id
              - consent_version
              properties:
                upload_id:
                  type: string
                consent_version:
                  type: string
      responses:
        '202':
          description: OCR job accepted if feature is enabled
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: post_reports
  /reports/{report_id}:
    get:
      summary: Read an owned report's extracted values and review status
      x-feature-flag: report_assistant_enabled__DEFAULT_FALSE
      parameters:
      - in: path
        name: report_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Report extraction; may contain unconfirmed values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabReport'
        '404':
          description: Not found or not owned by caller
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Disabled in all public releases unless written clinical, privacy and regulatory sign-offs; server-side
        default deny; no medical diagnosis.
      operationId: get_reports_report_id
  /account/export:
    post:
      summary: Create a current user's data export job
      responses:
        '202':
          description: Export job accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: post_account_export
  /account/delete:
    post:
      summary: Request deletion of the current user's account and data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirmation
              properties:
                confirmation:
                  type: string
                  enum:
                  - DELETE_MY_ACCOUNT
      responses:
        '202':
          description: Deletion job accepted with documented backup retention limits
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: post_account_delete
  /uploads/complete:
    post:
      summary: Verify uploaded object before processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCompletion'
      responses:
        '200':
          description: Validated or pending validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadVerified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: post_uploads_complete
  /food/logs/{log_id}:
    patch:
      summary: Correct logged item/portion, recalculating totals
      parameters:
      - in: path
        name: log_id
        required: true
        schema:
          type: string
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodLogCreate'
      responses:
        '200':
          description: Corrected record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: patch_food_logs_log_id
    delete:
      summary: Delete owned food log (tombstone for offline sync)
      parameters:
      - in: path
        name: log_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: delete_food_logs_log_id
  /measurements:
    get:
      summary: List owned dated measurements
      responses:
        '200':
          description: Measurements
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Measurement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_measurements
    post:
      summary: Create weight/height measurement, calculate BMI when eligible
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementCreate'
      responses:
        '201':
          description: Saved measurement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: post_measurements
  /mood/checkins:
    get:
      summary: List optional private mood check-ins
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MoodCheckIn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_mood_checkins
    post:
      summary: Create optional non-diagnostic mood check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodCheckInCreate'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoodCheckIn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: post_mood_checkins
  /consents:
    get:
      summary: Read current user purpose-specific consent decisions
      responses:
        '200':
          description: Consent records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_consents
    put:
      summary: Grant or withdraw one purpose-specific consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdate'
      responses:
        '200':
          description: Consent recorded; withdrawal prevents future processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: put_consents
  /reminder-preferences:
    get:
      summary: User reminder configuration
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_reminder_preferences
    put:
      summary: Set reminders/quiet hours; suppress generic goals if restriction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderPreferences'
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: put_reminder_preferences
  /foods/search:
    get:
      summary: Search curated local and international foods
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 100
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - si
          - ta
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - food_id
                      - name
                      - data_source_id
                      properties:
                        food_id:
                          type: string
                        name:
                          type: string
                        data_source_id:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_foods_search
  /recipes:
    get:
      summary: Curated recipes with source and budget metadata
      parameters:
      - in: query
        name: cuisine
        schema:
          type: string
      - in: query
        name: max_cost_lkr
        schema:
          type: number
          minimum: 0
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: get_recipes
  /meal-plans:
    post:
      summary: Draft user-reviewed budget meal plan; never invent prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanCreate'
      responses:
        '201':
          description: Draft plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      operationId: post_meal_plans
  /account/export/{job_id}:
    get:
      summary: Owned export job status and expiring link
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                required:
                - job_id
                - status
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - queued
                    - processing
                    - completed
                    - failed
                  download_url:
                    type:
                    - string
                    - 'null'
                    format: uri
                  expires_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get_account_export_job_id
  /account/delete/{job_id}:
    get:
      summary: Owned account deletion job status
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get_account_delete_job_id
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Malformed or invalid input; no sensitive fields echoed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Permission denied or feature unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Version conflict or idempotency-key payload mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: Domain rule failure or unsupported nutrition units
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limited; honor Retry-After header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Unknown resource or not owned by caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: Unspecified internal failure; no sensitive details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
