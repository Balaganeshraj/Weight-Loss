x-implementation-rules:
  age: Adult core app 18+; display adult BMI category only 20+ and suppress for pregnancy and other conditions needing
    tailored assessment; final jurisdictional/product review required.
  offline_sync: Client-generated UUID mutation IDs; stable idempotency keys; server deduplicates per user+route+key
    and payload hash; tombstones for delete; UTC storage + IANA local timezone at display.
  object_authorization: Never take owner/user ID from client; derive from bearer claims, verify owned object and purpose,
    return indistinguishable 404 for foreign resources.
  security: Rate limits, request size ceilings, secret manager, encryption at rest/transit, no raw health values in
    logs/analytics, short-lived signed URLs, mandatory malware scanning, provenance and audit trail.
  lab_feature_flag: report_assistant_enabled=false, refuse lab_report presign and all report endpoints server-side
    until multi-disciplinary sign-off.
  client_checks: Date/time validation, hydration volume/serving bounds, duration consistent with times, lower<=likely<=upper,
    energy calculation backend only, callback schema validation and no autonomous save.
  schema_maturity: Draft contract requires review by implementation team, codegen smoke tests and integration tests
    before claiming production readiness.
